
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MODDA GUDUVU</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "Helvetica Neue", Arial, sans-serif;
      color: #fff;

      /* Minimal Apple-inspired background */
      background:
        radial-gradient(ellipse at 20% 20%, #777 0%, transparent 48%),
        radial-gradient(ellipse at 80% 75%, #444 0%, transparent 50%),
        linear-gradient(135deg, #161616, #303030 50%, #111);
    }

    h1 {
      font-size: clamp(32px, 8vw, 64px);
      text-align: center;
      padding: 20px;
      font-weight: 600;
      letter-spacing: -2px;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 2px 30px #ffffff20;
    }

    /* Full-screen blur behind the popup */
    #popup {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;

      background: rgba(20, 20, 24, 0.18);
      backdrop-filter: blur(25px) saturate(160%);
      -webkit-backdrop-filter: blur(25px) saturate(160%);

      animation: fadeIn 0.5s ease;
    }

    /* Apple-inspired white Liquid Glass */
    .box {
      position: relative;
      isolation: isolate;
      overflow: hidden;

      width: 100%;
      max-width: 360px;
      padding: 36px 28px;
      border-radius: 30px;
      text-align: center;
      color: #161616;

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.78),
          rgba(255, 255, 255, 0.48) 45%,
          rgba(245, 245, 250, 0.38)
        );

      border: 1px solid rgba(255, 255, 255, 0.85);

      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.24),
        0 8px 24px rgba(0, 0, 0, 0.08),
        inset 0 1.5px 1px rgba(255, 255, 255, 0.95),
        inset 0 -1px 1px rgba(255, 255, 255, 0.28);

      animation: floatIn 0.7s cubic-bezier(.2, .8, .2, 1);
    }

    /* Soft glossy reflection */
    .box::before {
      content: "";
      position: absolute;
      z-index: -1;
      pointer-events: none;

      top: -65%;
      left: -25%;
      width: 150%;
      height: 110%;

      transform: rotate(-15deg);

      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.8),
        rgba(255, 255, 255, 0.22) 38%,
        transparent 75%
      );
    }

    /* Subtle glass refraction highlight */
    .box::after {
      content: "";
      position: absolute;
      pointer-events: none;
      inset: 1px;
      border-radius: 29px;
      background: linear-gradient(
        120deg,
        rgba(255, 255, 255, 0.25),
        transparent 35%,
        transparent 70%,
        rgba(255, 255, 255, 0.15)
      );
    }

    .box h2 {
      position: relative;
      margin: 0 0 12px;
      font-size: 30px;
      font-weight: 650;
      letter-spacing: -1px;
    }

    .box p {
      position: relative;
      color: rgba(20, 20, 25, 0.72);
      font-size: 15px;
      line-height: 1.6;
    }

    /* Frosted glass Instagram link */
    .instagram {
      position: relative;
      display: inline-block;
      max-width: 100%;
      margin: 12px 0 26px;
      padding: 12px 17px;

      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.9);

      background: rgba(255, 255, 255, 0.42);
      color: #303039;

      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      overflow-wrap: anywhere;

      box-shadow:
        0 3px 12px rgba(0, 0, 0, 0.04),
        inset 0 1px 1px rgba(255, 255, 255, 0.8);

      transition: background 0.25s, transform 0.25s;
    }

    .instagram:hover {
      background: rgba(255, 255, 255, 0.75);
      transform: translateY(-1px);
    }

    /* Glossy white glass button */
    #openBtn {
      position: relative;
      display: block;
      width: 100%;
      padding: 15px;

      border: 1px solid rgba(255, 255, 255, 0.95);
      border-radius: 17px;

      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.95),
        rgba(238, 238, 243, 0.8)
      );

      color: #17171a;
      font-family: inherit;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;

      box-shadow:
        0 6px 20px rgba(0, 0, 0, 0.1),
        inset 0 1px 1px white,
        inset 0 -1px 1px rgba(0, 0, 0, 0.04);

      transition: transform 0.25s, box-shadow 0.25s;
    }

    #openBtn:hover {
      transform: translateY(-2px);
      box-shadow:
        0 10px 26px rgba(0, 0, 0, 0.14),
        inset 0 1px 1px white;
    }

    #openBtn:active {
      transform: scale(0.98);
    }

    #openBtn:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    #message {
      margin-bottom: 0;
      font-size: 13px;
      color: #b42318;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes floatIn {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <h1>MODDA GUDUVU</h1>

  <audio id="music" loop preload="auto">
    <source src="./music.mp3" type="audio/mpeg">
  </audio>

  <div id="popup">
    <div class="box">
      <h2>Welcome ❤️</h2>
      <p>Check out my Instagram</p>

      <a
        class="instagram"
        href="https://www.instagram.com/YOUR_USERNAME/"
        target="_blank"
        rel="noopener noreferrer">
        📸 steelandsneakers
      </a>

      <button id="openBtn">Open ❤️</button>
      <p id="message" role="status" aria-live="polite"></p>
    </div>
  </div>

  <script>
    const music = document.getElementById("music");
    const popup = document.getElementById("popup");
    const button = document.getElementById("openBtn");
    const message = document.getElementById("message");

    button.addEventListener("click", async () => {
      button.disabled = true;
      message.textContent = "Starting music...";

      try {
        await music.play();
        popup.style.display = "none";
      } catch (error) {
        message.textContent =
          "Music couldn't start. Check that music.mp3 exists.";
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
