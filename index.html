<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MODDA GUDUVU</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: white;
    }

    h1 {
      font-size: clamp(32px, 8vw, 64px);
      text-align: center;
    }

    #popup {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.7);
    }

    .box {
      width: 100%;
      max-width: 350px;
      padding: 30px 24px;
      border-radius: 20px;
      background: white;
      text-align: center;
      box-shadow: 0 10px 40px #0003;
    }

    .instagram {
      display: inline-block;
      margin: 12px 0 24px;
      color: #d62976;
      font-size: 18px;
      font-weight: bold;
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    #openBtn {
      display: block;
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #111;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    #message {
      color: #c00;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <h1>MODDA GUDUVU</h1>

  <audio id="music" loop preload="auto">
    <source src="./music.mp3" type="audio/mpeg">
  </audio>

  <div id="popup">
    <div class="box">
      <h2>Welcome ❤️</h2>
      <p>Check out our Instagram</p>

      <a
        class="instagram"
        href="https://www.instagram.com/YOUR_USERNAME/"
        target="_blank"
        rel="noopener noreferrer">
        📸 steelandsneakers
      </a>

      <button id="openBtn">Open ❤️</button>
      <p id="message"></p>
    </div>
  </div>

  <script>
    const music = document.getElementById("music");
    const popup = document.getElementById("popup");
    const button = document.getElementById("openBtn");
    const message = document.getElementById("message");

    button.addEventListener("click", async () => {
      button.disabled = true;
      message.textContent = "Starting music...";

      try {
        await music.play();
        popup.style.display = "none";
      } catch (error) {
        message.textContent =
          "Music failed to start. Check the music.mp3 file.";
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
