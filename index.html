<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MODDA GUDUVU</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: white;
    }

    h1 {
      font-size: clamp(32px, 8vw, 64px);
      text-align: center;
    }

    /* Dark background behind popup */
    #popup {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.7);
    }

    /* Popup design */
    .box {
      width: 100%;
      max-width: 350px;
      padding: 30px 24px;
      border-radius: 20px;
      background: white;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      animation: appear 0.35s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: scale(0.85);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .instagram {
      display: inline-block;
      margin: 12px 0 24px;
      color: #d62976;
      font-size: 18px;
      font-weight: bold;
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    .instagram:hover {
      text-decoration: underline;
    }

    #openBtn {
      display: block;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #111;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    #openBtn:hover {
      background: #333;
      transform: scale(1.02);
    }

    #message {
      color: #c00;
      font-size: 14px;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>

  <h1>MODDA GUDUVU</h1>

  <!-- Music file in the same repository -->
  <audio id="music" loop preload="auto">
    <source src="./music.mp3" type="audio/mpeg">
    Your browser does not support audio.
  </audio>

  <!-- Welcome popup -->
  <div id="popup">
    <div class="box">

      <h2>Welcome ❤️</h2>

      <p>Check out my Instagram</p>

      <!-- Replace YOUR_USERNAME with your Instagram username -->
      <a
        class="instagram"
        href="https://www.instagram.com/YOUR_USERNAME/"
        target="_blank"
        rel="noopener noreferrer">
        📸 @YOUR_USERNAME
      </a>

      <button id="openBtn">Open ❤️</button>

      <p id="message" aria-live="polite"></p>

    </div>
  </div>

  <script>
    const music = document.getElementById("music");
    const popup = document.getElementById("popup");
    const button = document.getElementById("openBtn");
    const message = document.getElementById("message");

    button.addEventListener("click", async () => {
      button.disabled = true;
      message.textContent = "Starting music...";

      try {
        await music.play();

        // Hide popup only after music starts successfully
        popup.style.display = "none";

      } catch (error) {
        console.error("Music playback error:", error);

        message.textContent =
          "Music could not play. Check your music.mp3 file and internet connection.";

        button.disabled = false;
      }
    });
  </script>

</body>
</html>
