
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MODDA GUDUVU</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --green: #6aff9b;
      --green-light: #baffd0;
      --glass: rgba(255, 255, 255, 0.10);
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: white;
      background:
        radial-gradient(ellipse at 20% 20%, #174c31 0%, transparent 45%),
        radial-gradient(ellipse at 80% 80%, #103e2c 0%, transparent 45%),
        linear-gradient(135deg, #06120b, #0a2115 50%, #020805);
    }

    /* Background title */
    h1 {
      font-size: clamp(32px, 8vw, 64px);
      text-align: center;
      padding: 20px;
      color: rgba(255, 255, 255, 0.85);
      text-shadow: 0 0 35px rgba(106, 255, 155, 0.2);
    }

    /* Blurred glass overlay */
    #popup {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: rgba(0, 8, 4, 0.28);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      animation: fadeIn 0.5s ease;
    }

    /* Liquid glass card */
    .box {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      width: 100%;
      max-width: 360px;
      padding: 34px 26px;
      border-radius: 28px;
      text-align: center;

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.19),
          rgba(255, 255, 255, 0.035) 45%,
          rgba(105, 255, 155, 0.07)
        );

      border: 1px solid rgba(220, 255, 232, 0.32);

      box-shadow:
        0 25px 80px rgba(0, 0, 0, 0.5),
        0 0 35px rgba(76, 255, 135, 0.12),
        inset 0 1px 1px rgba(255, 255, 255, 0.4),
        inset 0 -1px 1px rgba(255, 255, 255, 0.08);

      color: white;
      animation: floatIn 0.7s cubic-bezier(.2,.8,.2,1);
    }

    /* Glossy reflection */
    .box::before {
      content: "";
      position: absolute;
      z-index: -1;
      top: -60%;
      left: -25%;
      width: 150%;
      height: 100%;
      pointer-events: none;
      transform: rotate(-15deg);
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.17),
        rgba(255, 255, 255, 0.035) 45%,
        transparent
      );
    }

    /* Soft green light inside the glass */
    .box::after {
      content: "";
      position: absolute;
      z-index: -1;
      width: 180px;
      height: 180px;
      right: -100px;
      bottom: -110px;
      border-radius: 50%;
      background: rgba(76, 255, 135, 0.2);
      filter: blur(35px);
      pointer-events: none;
    }

    .box h2 {
      margin: 0 0 12px;
      font-size: 30px;
      letter-spacing: -0.8px;
      text-shadow: 0 0 20px rgba(106, 255, 155, 0.25);
    }

    .box p {
      color: rgba(255, 255, 255, 0.78);
      line-height: 1.6;
    }

    .instagram {
      display: inline-block;
      margin: 12px 0 26px;
      padding: 11px 16px;
      max-width: 100%;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.07);
      color: var(--green-light);
      font-size: 17px;
      font-weight: bold;
      text-decoration: none;
      overflow-wrap: anywhere;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
      transition: 0.25s ease;
    }

    .instagram:hover {
      background: rgba(106, 255, 155, 0.13);
      border-color: rgba(106, 255, 155, 0.5);
      box-shadow: 0 0 25px rgba(106, 255, 155, 0.12);
    }

    /* Liquid glass button */
    #openBtn {
      display: block;
      width: 100%;
      padding: 15px;
      border: 1px solid rgba(220, 255, 232, 0.65);
      border-radius: 16px;

      background: linear-gradient(
        135deg,
        rgba(137, 255, 173, 0.95),
        rgba(51, 214, 111, 0.85)
      );

      color: #062511;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;

      box-shadow:
        0 8px 25px rgba(53, 255, 119, 0.18),
        inset 0 1px 1px rgba(255, 255, 255, 0.8);

      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    #openBtn:hover {
      transform: translateY(-2px);
      box-shadow:
        0 12px 32px rgba(53, 255, 119, 0.3),
        inset 0 1px 1px rgba(255, 255, 255, 0.8);
    }

    #openBtn:active {
      transform: scale(0.98);
    }

    #openBtn:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    #message {
      color: #ffaaaa;
      font-size: 13px;
      margin-bottom: 0;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes floatIn {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.94);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <h1>MODDA GUDUVU</h1>

  <audio id="music" loop preload="auto">
    <source src="./music.mp3" type="audio/mpeg">
  </audio>

  <div id="popup">
    <div class="box">
      <h2>Welcome <span>❤️</span></h2>
      <p>Check out our Instagram</p>

      <a
        class="instagram"
        href="https://www.instagram.com/YOUR_USERNAME/"
        target="_blank"
        rel="noopener noreferrer">
        📸 steelandsneakers
      </a>

      <button id="openBtn">Open ❤️</button>
      <p id="message" role="status" aria-live="polite"></p>
    </div>
  </div>

  <script>
    const music = document.getElementById("music");
    const popup = document.getElementById("popup");
    const button = document.getElementById("openBtn");
    const message = document.getElementById("message");

    button.addEventListener("click", async () => {
      button.disabled = true;
      message.textContent = "Starting music...";

      try {
        await music.play();
        popup.style.display = "none";
      } catch (error) {
        message.textContent =
          "Music couldn't start. Check that music.mp3 exists.";
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
